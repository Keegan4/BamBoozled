# Daily cards for the Notes tab. One card is shown a day, in a random order per person, with no
# repeats until every card has been seen. See docs/daily-notes.md for the full guide.
#
# Each card:
#   id     unique, lowercase-with-dashes. Never change it once released (it remembers what was seen).
#   photo  a file in this folder: JPG, PNG or WebP, portrait 4:5, about 1080 px tall, under 500 KB.
#   title  optional, shown on the back of the card.
#   text   the message on the back. Keep it short: up to about 400 characters.

- id: bamboo-forest
  photo: bamboo-forest.jpg
  title: A walk in the bamboo
  text: |
    Pandas spend up to 14 hours a day eating.
    Take a proper lunch break today.

- id: morning-light
  photo: morning-light.jpg
  title: Small steps
  text: |
    You don't have to finish everything today.
    Pick one thing from Do next and enjoy ticking it off.

- id: starry-night
  photo: starry-night.jpg
  title: Rest is productive too
  text: |
    Even pandas need a good night's sleep.
    Close the laptop on time tonight.
