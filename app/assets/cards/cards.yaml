# The cards for the Notes tab's daily packs. See docs/card-packs.md for the full guide.
#
# Each card:
#   id       unique, lowercase-with-dashes. Never change it once released: collections are saved by id.
#   name     the name on the card's banner (keep it under about 18 characters)
#   rarity   common, rare, epic or legendary (default: common)
#   photo    a file in this folder: JPG, PNG or WebP, about 1080 x 1350 px, under 500 KB
#   text     the short message in the card's text box (up to 90 characters)
#   flavour  optional: the quote shown when the card is opened in the binder (up to 300 characters)
#   artist   optional: credited in the binder, and signed on "Signed" cards
#   set      optional: the set name shown in the binder (default: Bamboo Grove)
#   exclude  optional: finishes this card never gets, e.g. [misprint, ghost]
#   themes   optional: the themes (from themes.yaml) this card belongs to, e.g. [school-day]
#
# Cards are numbered in the order they appear here, so add new cards at the end.

- id: ackshually
  name: Ackshually
  rarity: common
  photo: Ackshually.png
  text: No clue why you are fat and pointing up.
  flavour: If youre seeing this, this is ackshually the first card I created. I made this at 11pm so I hope youre loving this present. Love you *90000

- id: ackshually-keegan
  name: Ackshually Keegan
  rarity: common
  photo: AckshuallyKeegan.jpg
  text: I am clearly the sharpest tool in the shed
  flavour: I remember this was one of your favourites for a time.

- id: angel-fattie
  name: Angel Fattie
  rarity: epic
  photo: AngelFattie.jpg
  text: OMG youre so CUTEEEE
  flavour: Its so ironic that youre angel but youre a free thinker. You should wear this dress more

- id: both-bugis-sleepy
  name: Both Bugis Sleepy
  rarity: rare
  photo: BothBugisSleepy.jpg
  text: My mouth is like the size of your face
  flavour: Youre head like fits so nicely into my neck. I guess youre made for me
  themes: [both, sleepy]

- id: both-bus
  name: Both Bus
  rarity: common
  photo: BothBus.jpeg
  text: I'm being covered by youuu
  flavour: Me when im trying to take a nice photo then a fattie occupies half my screen
  themes: [both]

- id: both-call-fatties
  name: Both Call Fatties
  rarity: epic
  photo: BothCallFatties.jpg
  text: We have the exact same face but youre cut off
  flavour: For this flavour text, I look like a giant fat tomato.
  themes: [both]

- id: both-cool-guys
  name: Both Cool Guys
  rarity: common
  photo: BothCoolGuys.jpg
  text: We are movie stars
  flavour: There is a cool guy and theres my fattie. Also i always wear that one shirt
  themes: [both]

- id: both-covered
  name: Both Covered
  rarity: rare
  photo: BothCovered.jpeg
  text: OMG its a edgy girl
  flavour: This was quite early on in the relationship also, at this early stage, you were already megafat.
  themes: [both]

- id: both-crying
  name: Both Crying
  rarity: epic
  photo: BothCrying.jpg
  text: Why are you crying 
  flavour: You look like youve been crying for like an hour. This was way before I ever saw you cry for real though, cheers to many more moments, whether they are happy or sad.
  themes: [both]

- id: both-elevator
  name: Both Elevator
  rarity: common
  photo: BothElevator.jpeg
  text: You look so contented with what youre seeing
  flavour: Idk why you seem so tall in this photo. Also youre smiling and looking at yourself in the photo, what a fattie.
  themes: [both]

- id: both-fat
  name: Both Fat
  rarity: common
  photo: BothFat.jpeg
  text: Your face is red like you just slept on your keyboard
  flavour: My lips are so dry, also a rare photo where youre taller than me.
  themes: [both]

- id: both-judgemental
  name: Both Judgemental
  rarity: legendary
  photo: BothJudgemental.jpg
  text: Youre my little bundle of joy
  flavour: Youre smiling so brightly in this photo, always makes me wonder how i manage to bring you so much joy. Photos like that are what will make me never stop wanting to squish you. ILOVEUUUUU!
  themes: [both]

