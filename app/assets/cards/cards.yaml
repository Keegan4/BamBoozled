# The cards for the Notes tab's daily packs. See docs/card-packs.md for the full guide.
#
# Each card:
#   id       unique, lowercase-with-dashes. Never change it once released: collections are saved by id.
#   name     the name on the card's banner (keep it under about 18 characters)
#   rarity   common, rare, epic or legendary (default: common)
#   photo    a file in this folder: JPG, PNG or WebP, about 1080 x 1350 px, under 500 KB
#   text     the short message in the card's text box (up to 90 characters)
#   flavour  optional: the quote shown when the card is opened in the binder (up to 300 characters)
#   artist   optional: credited in the binder, and signed on "Signed" cards
#   set      optional: the set name shown in the binder (default: Bamboo Grove)
#   exclude  optional: finishes this card never gets, e.g. [misprint, ghost]
#   themes   optional: the themes (from themes.yaml) this card belongs to, e.g. [school-day]
#
# Cards are numbered in the order they appear here, so add new cards at the end.

- id: ackshually
  name: Ackshually
  rarity: common
  photo: Ackshually.png
  text: No clue why you are fat and pointing up.
  flavour: If youre seeing this, this is ackshually the first card I created. I made this at 11pm so I hope youre loving this present. Love you *90000

- id: ackshually-keegan
  name: Ackshually Keegan
  rarity: common
  photo: AckshuallyKeegan.jpg
  text: I am clearly the sharpest tool in the shed
  flavour: I remember this was one of your favourites for a time.

- id: angel-fattie
  name: Angel Fattie
