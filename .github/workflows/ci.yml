name: CI

# Runs on every push and pull request. Everything must pass before merging:
#   * Flutter: formatting, static analysis, all tests, and a coverage minimum
#   * Database: the Supabase SQL migration is run against a real PostgreSQL server and tested
#   * Builds: the app compiles for Linux, Windows and Android

on:
  push:
    branches: ['**']
    tags-ignore: ['**'] # releases are handled by release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        description: Also build the apps ("no" when release.yml calls this; it builds them itself)
        type: string
        default: 'yes'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  MIN_COVERAGE: 95

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Check coverage is at least ${{ env.MIN_COVERAGE }}%
        run: dart run tool/check_coverage.dart ${{ env.MIN_COVERAGE }}

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run migration and SQL tests
        run: ./supabase/tests/run.sh

  build:
    name: Build ${{ matrix.name }}
    needs: [test, database]
    # `inputs` is empty on push/pull_request, which counts as "build".
    if: ${{ inputs.build != 'no' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: linux-bundle
            path: app/build/linux/x64/release/bundle
          - name: Windows
            os: windows-latest
            command: flutter build windows --release
            artifact: windows-bundle
            path: app/build/windows/x64/runner/Release
          - name: Android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: android-apk
            path: app/build/app/outputs/flutter-apk/app-release.apk
          - name: macOS
            os: macos-latest
            command: flutter build macos --release
            artifact: macos-app
            path: app/build/macos/Build/Products/Release/BamBoozled.app
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # With the two repository secrets set, the apps built here can sync. Without them (and on pull
      # requests from forks, which never get secrets) they still build and keep tasks on one device.
      DEFINES: >-
        --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: actions/setup-java@v4
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        env:
          BUILD_COMMAND: ${{ matrix.command }}
        run: $BUILD_COMMAND $DEFINES

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 7
